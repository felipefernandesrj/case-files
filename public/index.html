<div class="shell">
<header>
  <h1 id="title" class="with-icon"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-score"></use></svg> <span data-label="">Case Files</span></h1>
  <div class="hud-tools">
    <button id="len" aria-pressed="true" class="with-icon"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-lang"></use></svg> <span data-label="">EN</span></button>
    <button id="lpt" aria-pressed="false" class="with-icon"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-lang"></use></svg> <span data-label="">PT</span></button>
    <button id="restart-btn" type="button" class="with-icon"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-restart"></use></svg> <span data-label="">Start over</span></button>
  </div>
</header>

<section id="cabinet" hidden>
  <p class="stamp" id="cabinet-stamp">Field office</p>
  <h2 id="cabinet-title" class="with-icon"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-files"></use></svg> <span data-label="">Case Files</span></h2>
  <p id="cabinet-lead">Two closed rooms. Open a file, ask the questions, name who did it.</p>
  <div id="cabinet-list"></div>
</section>

<main id="play">
  <section id="briefing" class="panel is-on" data-panel="briefing" aria-labelledby="title">
    <p class="stamp" id="brief-stamp">Case file</p>
    <section id="intro"></section>
  </section>


  <section id="suspects" class="panel" data-panel="suspects">
    <h2 id="suspects-title" class="with-icon"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-suspects"></use></svg> <span data-label="">Suspects</span></h2>
    <div id="suspect-buttons"></div>
  </section>

  <section id="conversation" class="panel" data-panel="talk">
    <h2 id="conversation-title" class="with-icon"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-talk"></use></svg> <span data-label="">Conversation</span></h2>
    <div id="log" role="log" aria-live="polite"></div>
    <form id="ask-form">
      <label for="q" id="question-label">Question</label>
      <div class="ask-row">
        <input type="text" id="q" maxlength="500" required>
        <button type="submit" id="ask-btn" class="with-icon"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-talk"></use></svg> <span data-label="">Ask</span></button>
      </div>
    </form>
    <p id="questions-used" aria-live="polite"></p>
  </section>

  <section id="player-section" class="panel" data-panel="accuse">
    <label for="player" id="player-label">Your name</label>
    <input type="text" id="player" maxlength="24" placeholder="anon">
  </section>

  <section id="accuse-section" class="panel" data-panel="accuse">
    <h2 id="accuse-title" class="with-icon"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-accuse"></use></svg> <span data-label="">Accuse</span></h2>
    <div id="accuse-buttons"></div>
  </section>


  <section id="rooms" class="panel" data-panel="locations" aria-labelledby="rooms-title">
    <h2 id="rooms-title" class="visually-in-section with-icon"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-locations"></use></svg> <span data-label="">Locations</span></h2>
    <div id="room-buttons"></div>
  </section>
  <style>
    #rooms { display: grid; }
    #room-buttons { display: contents; }
    #rooms-title { margin: 0 0 0.5rem; grid-column: 1 / -1; }
  </style>

  <section id="timeline" class="panel" hidden data-panel="locations" aria-labelledby="timeline-title">
    <h2 id="timeline-title" class="with-icon"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-tl-marker"></use></svg> <span data-label="">Timetable</span></h2>
    <div id="timeline-rail"></div>
  </section>

  <section id="board" class="panel" data-panel="board" aria-labelledby="board-title">
    <h2 id="board-title" class="with-icon"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-board"></use></svg> <span data-label="">Evidence board</span></h2>
    <div id="board-grid"></div>
  </section>

  <section id="verdict" class="panel" data-panel="accuse" role="status" aria-live="assertive" tabindex="-1" hidden></section>
  <section id="err" class="panel" data-panel="accuse" role="alert" hidden></section>

  <section id="best-section" class="panel" data-panel="accuse" aria-labelledby="best-title">
    <h2 id="best-title" class="with-icon"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-score"></use></svg> <span data-label=""></span></h2>
    <p id="best-en"></p>
    <p id="best-pt"></p>
    <button id="reset-best" type="button">Reset Best</button>
    <p id="best-status" role="status"></p>
  </section>
  <section id="scores-section" class="panel" data-panel="accuse" hidden>
    <h2 id="scores-title" class="with-icon"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-score"></use></svg> <span data-label="">Scoreboard</span></h2>
    <table>
      <caption id="scores-caption">Top 10 Players</caption>
      <thead>
        <tr>
          <th>#</th>
          <th id="th-player">Player</th>
          <th id="th-score">Score</th>
          <th id="th-questions">Questions</th>
        </tr>
      </thead>
      <tbody id="scores-body"></tbody>
    </table>
  </section>

  <section id="credits" class="panel" data-panel="accuse" aria-labelledby="credits-title" tabindex="-1" hidden>
    <h2 id="credits-title"></h2>
    <ul id="credits-list"></ul>
    <p id="credits-note"></p>
  </section>
</main>

<nav id="dock" aria-label="Case tools">
  <div id="steps" role="tablist" aria-label="Case steps">
    <button type="button" role="tab" id="step-briefing" data-step="briefing" aria-selected="true" class="with-icon"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-briefing"></use></svg> <span data-step-label="briefing">Briefing</span></button>
    <button type="button" role="tab" id="step-locations" data-step="locations" aria-selected="false" class="with-icon"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-locations"></use></svg> <span data-step-label="locations">Locations</span></button>
    <button type="button" role="tab" id="step-suspects" data-step="suspects" aria-selected="false" class="with-icon"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-suspects"></use></svg> <span data-step-label="suspects">Suspects</span></button>
    <button type="button" role="tab" id="step-talk" data-step="talk" aria-selected="false" class="with-icon"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-talk"></use></svg> <span data-step-label="talk">Interrogate</span></button>
    <button type="button" role="tab" id="step-board" data-step="board" aria-selected="false" class="with-icon"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-board"></use></svg> <span data-step-label="board">Board</span></button>
    <button type="button" role="tab" id="step-accuse" data-step="accuse" aria-selected="false" class="with-icon"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-accuse"></use></svg> <span data-step-label="accuse">Accuse</span></button>
  </div>
  <button type="button" id="files-btn" class="icon-btn with-icon"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-files"></use></svg> <span data-label="">Files</span></button>
  <button type="button" id="board-btn" class="icon-btn with-icon"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-board"></use></svg> <span data-label="">Board</span></button>
</nav>
</div>

<script type="module">

function iconSvg(id, cls) {
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('class', cls || 'icon');
  svg.setAttribute('aria-hidden', 'true');
  svg.setAttribute('focusable', 'false');
  const use = document.createElementNS('http://www.w3.org/2000/svg', 'use');
  use.setAttribute('href', '#' + id);
  svg.appendChild(use);
  return svg;
}
function setText(elOrId, text) {
  const el = typeof elOrId === 'string' ? document.getElementById(elOrId) : elOrId;
  if (!el) return;
  let lab = el.querySelector('[data-label]');
  if (!lab) {
    const keep = el.querySelector('svg.icon');
    lab = document.createElement('span');
    lab.setAttribute('data-label', '');
    el.innerHTML = '';
    if (keep) el.appendChild(keep);
    el.appendChild(lab);
  }
  lab.textContent = text;
}
function applyLayout() {
  const w = window.innerWidth;
  document.body.dataset.layout = w >= 1280 ? 'desktop' : (w >= 768 ? 'tablet' : 'phone');
}

async function init() {
  const sessRes = await fetch(API + '/session', {method:'POST'});
  const sessData = await sessRes.json();
  sessionId = sessData.sessionId;
  if (sessData.file) openFile = sessData.file;
  const wanted = new URLSearchParams(location.search).get('case');
  if (wanted) openFile = wanted;
  await loadPackList();
  await loadCase();
  await setLang('en');
}

async function loadPackList() {
  try {
    const res = await fetch(API + '/cases?lang=' + lang);
    const data = await res.json();
    packList = data.cases || [];
  } catch {
    packList = [];
  }
}

async function loadCase() {
  const extra = openFile ? '&case=' + encodeURIComponent(openFile) : '';
  const res = await fetch(API + '/case?lang=' + lang + extra);
  caseData = await res.json();
  if (caseData && caseData.file) openFile = caseData.file;
}

function initials(name) {
  return (name || '?').split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase();
}

function renderCase() {
  if (!caseData) return;
  document.getElementById('intro').innerHTML = `<p>${caseData.intro}</p>`;
  syncTitle();
  document.documentElement.setAttribute('data-accent', caseData.file === 'violin' ? 'salon' : 'rails');
  const btnContainer = document.getElementById('suspect-buttons');
  btnContainer.innerHTML = '';
  caseData.suspects.forEach(s => {
    const btn = document.createElement('button');
    const face = document.createElement('span');
    face.className = 'portrait';
    face.setAttribute('aria-hidden', 'true');
    face.textContent = initials(s.name);
    const who = document.createElement('span');
    who.className = 'who';
    who.textContent = s.name;
    const role = document.createElement('span');
    role.className = 'role with-icon';
    const roleIcon = ROLE_ICONS[s.id];
    if (roleIcon) role.appendChild(iconSvg(roleIcon, 'icon badge-icon'));
    role.appendChild(document.createTextNode(s.role || ''));
    btn.appendChild(face);
    btn.appendChild(who);
    if (s.role) btn.appendChild(role);
    btn.dataset.id = s.id;
    btn.setAttribute('aria-pressed','false');
    btn.addEventListener('click',()=>selectSuspect(s.id));
    btnContainer.appendChild(btn);
  });
  renderRooms();
  renderTimeline();
  renderBoard();
}

function renderRooms() {
  const wrap = document.getElementById('room-buttons');
  wrap.innerHTML = '';
  const rooms = (caseData && caseData.rooms) || [];
  rooms.forEach(r => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'room';
    btn.dataset.room = r.id;
    btn.dataset.id = r.id;
    btn.setAttribute('aria-pressed', currentRoom === r.id ? 'true' : 'false');
    const name = document.createElement('span');
    name.className = 'room-name';
    name.appendChild(iconSvg(ROOM_ICONS[r.id] || 'i-locations'));
    name.appendChild(document.createTextNode(r.name));
    btn.appendChild(name);
    btn.addEventListener('click', () => inspectRoom(r));
    wrap.appendChild(btn);
  });
}

function inspectRoom(r) {
  currentRoom = r.id;
  renderRooms();
  const label = r.name;
  if (!pins.some(p => p.id === r.id)) {
    pins.push({ id: r.id, label });
    renderBoard();
  }
}

function renderTimeline() {
  const sec = document.getElementById('timeline');
  const rail = document.getElementById('timeline-rail');
  const items = (caseData && caseData.timeline) || [];
  if (!items.length) { sec.hidden = true; rail.innerHTML = ''; return; }
  sec.hidden = false;
  rail.innerHTML = '';
  items.forEach(t => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'tl-stop';
    if (t.id) b.dataset.id = t.id;
    b.appendChild(iconSvg(t.gap ? 'i-tl-gap' : 'i-tl-marker'));
    const tm = document.createElement('strong');
    tm.textContent = t.time || '';
    b.appendChild(tm);
    b.appendChild(document.createTextNode((t.stop ? t.stop + '. ' : '') + (t.event || '')));
    rail.appendChild(b);
  });
}

function renderBoard() {
  const grid = document.getElementById('board-grid');
  grid.innerHTML = '';
  if (!pins.length) {
    const empty = document.createElement('p');
    empty.className = 'ev-empty with-icon';
    empty.appendChild(iconSvg('i-pin'));
    empty.appendChild(document.createTextNode(UI[lang].emptyBoard));
    grid.appendChild(empty);
    return;
  }
  pins.forEach((p, i) => {
    const tile = document.createElement('button');
    tile.type = 'button';
    tile.className = 'ev-tile with-icon';
    tile.appendChild(iconSvg(PIN_ICONS[p.id] || 'i-pin'));
    tile.appendChild(document.createTextNode(p.label));
    tile.setAttribute('aria-label', UI[lang].unpin + ': ' + p.label);
    tile.addEventListener('click', () => { pins.splice(i, 1); renderBoard(); });
    grid.appendChild(tile);
  });
}

function renderCabinet() {
  const list = document.getElementById('cabinet-list');
  list.innerHTML = '';
  packList.forEach((item, i) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'folder-card';
    btn.dataset.file = item.id;
    const art = document.createElement('div');
    art.className = 'folder-art';
    art.setAttribute('aria-hidden', 'true');
    art.appendChild(iconSvg(item.id === 'violin' ? 'i-ev-violin' : 'i-loc-train', 'icon icon-lg'));
    const title = document.createElement('strong');
    title.textContent = item.title;
    const hook = document.createElement('span');
    hook.textContent = item.hook;
    const go = document.createElement('span');
    go.className = 'with-icon';
    go.appendChild(iconSvg('i-unlocked'));
    go.appendChild(document.createTextNode(UI[lang].openFile));
    btn.appendChild(art);
    btn.appendChild(title);
    btn.appendChild(hook);
    btn.appendChild(go);
    btn.addEventListener('click', () => openPackFile(item.id));
    list.appendChild(btn);
  });
}

function showCabinet() {
  document.getElementById('cabinet').hidden = false;
  document.getElementById('play').hidden = true;
  document.body.dataset.view = 'cabinet';
  syncTitle();
  const first = document.querySelector('#cabinet-list button');

function showPlay() {

}

async function openPackFile(id) {
  const sessRes = await fetch(API + '/session', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ case: id })});
  const sessData = await sessRes.json();
  sessionId = sessData.sessionId;
  openFile = id;
  for (const k of Object.keys(histories)) delete histories[k];
  pins = [];
  currentRoom = null;
  questionsUsed = 0;
  selectedSuspect = null;
  lastAccuseResult = null;
  gameOver = false;
  setGameOver(false);
  document.getElementById('log').innerHTML = '';
  const verdict = document.getElementById('verdict');
  verdict.hidden = true;
  verdict.innerHTML = '';
  document.getElementById('credits').hidden = true;
  document.getElementById('scores-section').hidden = true;
  document.getElementById('err').hidden = true;
  document.getElementById('best-status').textContent = '';
  await loadCase();
  renderQuestions();
  renderBest();
  renderCase();
  renderAccuseButtons();
  renderConversation();
  showPlay();
  showStep('briefing');
  const first = document.querySelector('#suspect-buttons button');
  if (first) first.focus();
}

document.getElementById('files-btn').addEventListener('click', async () => {
  await loadPackList();
  renderCabinet();
  showCabinet();
});
document.getElementById('board-btn').addEventListener('click', () => {
  showPlay();
  showStep('board');
  renderBoard();
  document.getElementById('board-title').focus?.();
  document.getElementById('board').scrollIntoView({ block: 'nearest' });
});
document.getElementById('steps').addEventListener('click', (ev) => {
  const btn = ev.target.closest('[data-step]');
  if (!btn) return;
  showPlay();
  showStep(btn.dataset.step);
  if (btn.dataset.step === 'board') renderBoard();
});

function selectSuspect(id) {
  selectedSuspect = id;
  const bs = document.getElementById('best-status');
  if (bs.textContent === LABELS.en.pickSuspect || bs.textContent === LABELS.pt.pickSuspect) bs.textContent = '';
  document.querySelectorAll('#suspect-buttons button').forEach(b=>{
    b.setAttribute('aria-pressed', b.dataset.id===id ? 'true':'false');
  });
  showStep('talk');
  document.getElementById('q').focus();
  renderConversation();
}

function renderConversation() {
  const log = document.getElementById('log');
  log.innerHTML = '';
  if (!selectedSuspect) return;
  const hist = histories[selectedSuspect] || [];
  hist.forEach(pair=>{
    const pQ = document.createElement('p');
    pQ.textContent = (lang==='pt'?'Pergunta: ':'Q: ') + pair.q;
    const pA = document.createElement('p');
    pA.textContent = (lang==='pt'?'Resposta: ':'A: ') + pair.a;
    log.appendChild(pQ);
    log.appendChild(pA);
  });
}

async function askQuestion(e){
  e.preventDefault();
  if (gameOver) return;
  if (!selectedSuspect) { document.getElementById('best-status').textContent = LABELS[lang].pickSuspect; return; }
  const question = document.getElementById('q').value.trim();
  if (!question) { document.getElementById('best-status').textContent = LABELS[lang].emptyQuestion; document.getElementById('q').focus(); return; }
  const qInput = document.getElementById('q');
  const askBtn = document.getElementById('ask-btn');
  const askForm = document.getElementById('ask-form');
  const accuseBtns = document.querySelectorAll('#accuse-buttons button');
  const restartBtn = document.getElementById('restart-btn');
  askBtn.disabled = true;
  qInput.disabled = true;
  accuseBtns.forEach(b => { b.disabled = true; });
  if (restartBtn) restartBtn.disabled = true;
  askForm.setAttribute('aria-busy', 'true');
  const log = document.getElementById('log');
  const thinking = document.createElement('p');
  thinking.textContent = LABELS[lang].thinking;
  log.appendChild(thinking);
  try{
    const res = await fetch(API + '/ask', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({sessionId, suspectId:selectedSuspect, question, lang})
    });
    const data = await res.json();
    if (!res.ok) throw data;
    const answer = data.answer;
    questionsUsed = data.questions;
    renderQuestions();
    if (!histories[selectedSuspect]) histories[selectedSuspect]=[];
    histories[selectedSuspect].push({q:question,a:answer});
    renderConversation();
  }catch(err){
    showError(err.message||'Error');
  }finally{
    if (thinking.parentNode) thinking.remove();
    askBtn.disabled = false;
    qInput.disabled = false;
    accuseBtns.forEach(b => { b.disabled = false; });
    if (restartBtn) restartBtn.disabled = false;
    askForm.removeAttribute('aria-busy');
    qInput.value = '';
    qInput.focus();
  }
}

async function accuse(suspectId){
  const playerName = document.getElementById('player').value.trim()||'anon';
  try{
    const res = await fetch(API + '/accuse', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({sessionId, suspectId, player:playerName, lang})
    });
    const data = await res.json();
    if (!res.ok) throw data;
    lastAccuseResult = data;
    const rec = recordResult(store, lang, data);
    renderBest();
    document.getElementById('best-status').textContent = rec.isNew ? LABELS[lang].newBest : '';
    renderVerdict(true);
    setGameOver(true);
    await loadScores();
    await loadCredits(true);
  }catch(err){
    showError(err.message||'Error');
  }
}

function renderAccuseButtons(){
  if (!caseData) return;
  const container = document.getElementById('accuse-buttons');
  container.innerHTML = '';
  caseData.suspects.forEach(s=>{
    const btn = document.createElement('button');
    btn.className = 'with-icon';
    const ico = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    ico.setAttribute('class', 'icon');
    ico.setAttribute('aria-hidden', 'true');
    ico.setAttribute('focusable', 'false');
    const use = document.createElementNS('http://www.w3.org/2000/svg', 'use');
    use.setAttribute('href', '#i-accuse');
    ico.appendChild(use);
    btn.appendChild(ico);
    btn.appendChild(document.createTextNode((lang==='pt'?'Acusar ':'Accuse ') + s.name));
    btn.addEventListener('click',()=>{
      if (gameOver) return;
      if (confirm(LABELS[lang].confirmAccuse.replace('{name}', s.name))) {
        accuse(s.id);
      }
    });
    container.appendChild(btn);
  });
  if (gameOver) {
    container.querySelectorAll('button').forEach(b => { b.disabled = true; });
  }
}

async function loadScores(){
  const sec = document.getElementById('scores-section');
  const tbody = document.getElementById('scores-body');
  const extra = (typeof openFile === 'string' && openFile) ? ('?case=' + encodeURIComponent(openFile)) : '';
  const res = await fetch(API + '/scores' + extra);
  const data = await res.json();
  tbody.innerHTML = '';
  data.forEach((row,i)=>{
    const tr = document.createElement('tr');
    [i + 1, row.player, row.score, row.questions].forEach(value => {
      const td = document.createElement('td');
      td.textContent = String(value);
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  sec.hidden = false;
}

async function loadCredits(moveFocus = true) {
  try {
    const res = await fetch(API + '/credits?lang=' + lang);
    const data = await res.json();
    const section = document.getElementById('credits');
    const title = document.getElementById('credits-title');
    const list = document.getElementById('credits-list');
    const note = document.getElementById('credits-note');

    title.textContent = data.title;
    list.innerHTML = '';
    data.backers.forEach(name => {
      const li = document.createElement('li');
      li.textContent = name;
      list.appendChild(li);
    });

    if (data.example) {
      note.textContent = lang === 'pt' ? 'Nomes de exemplo' : 'Example names';
      note.hidden = false;
    } else {
      note.hidden = true;
    }

    section.hidden = false;
    if (moveFocus) section.focus();
  } catch (e) {
    console.error('Credits error:', e);
  }
}

function renderVerdict(moveFocus = true) {
  if (!lastAccuseResult) return;
  const verdict = document.getElementById('verdict');
  verdict.hidden = false;
  const { correct, culpritName, solution, score } = lastAccuseResult;
  verdict.classList.toggle('ok', !!correct);
  const stamp = correct ? (lang==='pt'?'Você acertou!':'Correct!') : (lang==='pt'?'Você errou!':'Wrong!');
  verdict.innerHTML = '';
  const p1 = document.createElement('p');
  p1.className = 'verdict-stamp';
  p1.appendChild(iconSvg(correct ? 'i-verdict-ok' : 'i-verdict-wrong'));
  p1.appendChild(document.createTextNode(stamp));
  const p2 = document.createElement('p');
  p2.textContent = (lang==='pt'?'Culpado':'Culprit') + ': ' + culpritName;
  const p3 = document.createElement('p');
  p3.textContent = (lang==='pt'?'Solução':'Solution') + ': ' + solution;
  const p4 = document.createElement('p');
  p4.className = 'with-icon';
  p4.appendChild(iconSvg('i-score'));
  p4.appendChild(document.createTextNode((lang==='pt'?'Pontuação':'Score') + ': ' + score));
  verdict.appendChild(p1);
  verdict.appendChild(p2);
  verdict.appendChild(p3);
  verdict.appendChild(p4);
  showStep('accuse');
  if (moveFocus) verdict.focus();
}

function showError(msg){
  const el = document.getElementById('err');

  el.hidden = false;
  setTimeout(()=>{el.hidden=true;},5000);
}

async function restartGame(){
  if (!confirm(LABELS[lang].confirmRestart)) return;
  const sessRes = await fetch(API + '/session', {method:'POST'});
  const sessData = await sessRes.json();
  sessionId = sessData.sessionId;
  for (const k of Object.keys(histories)) delete histories[k];
  questionsUsed = 0;
  selectedSuspect = null;
  lastAccuseResult = null;
  gameOver = false;
  setGameOver(false);
  document.getElementById('log').innerHTML = '';
  const verdict = document.getElementById('verdict');
  verdict.hidden = true;
  verdict.innerHTML = '';
  document.getElementById('credits').hidden = true;
  document.getElementById('scores-section').hidden = true;
  document.getElementById('err').hidden = true;
  document.getElementById('ask-btn').disabled = false;
  document.getElementById('q').disabled = false;
  document.getElementById('q').value = '';
  document.getElementById('ask-form').removeAttribute('aria-busy');
  document.querySelectorAll('#accuse-buttons button').forEach(b => { b.disabled = false; });
  document.getElementById('restart-btn').disabled = false;
  document.getElementById('best-status').textContent = '';
  pins = [];
  currentRoom = null;
  renderQuestions();
  renderBest();
  renderCase();
  renderAccuseButtons();
  renderConversation();
  if (typeof showStep === 'function') showStep('briefing');
  const first = document.querySelector('#suspect-buttons button');
  if (first) first.focus();
  else document.getElementById('q').focus();
}
document.getElementById('restart-btn').addEventListener('click', restartGame);
document.getElementById('ask-form').addEventListener('submit',askQuestion);
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  const q = document.getElementById('q');
  if (document.activeElement !== q && e.target !== q) return;
  q.value = '';
  q.focus();
});
init();
</script>
