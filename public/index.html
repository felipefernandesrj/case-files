<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Caso em 3 Atos</title><style>
body{font-family:system-ui;max-width:720px;margin:auto;padding:1rem;background:#14161a;color:#eee}
.s{display:flex;gap:.5rem;flex-wrap:wrap}.s button{flex:1;min-width:150px}button{padding:.6rem;border-radius:6px;border:1px solid #555;background:#252a33;color:#eee;cursor:pointer}
button.on{border-color:#e6b450}#log{min-height:160px;background:#1d2026;padding:.6rem;border-radius:6px;margin:.6rem 0}.err{color:#ff8a80;background:#2a1d1d;padding:.4rem;border-radius:6px}
form{display:flex;gap:.4rem}input{flex:1;padding:.6rem;border-radius:6px;border:1px solid #555;background:#1d2026;color:#eee}
header{display:flex;justify-content:space-between;align-items:center}ol{padding-left:1.2rem}
</style></head><body><header><small>Caso em 3 Atos · Case Files #1</small><span><button id="len">EN</button> <button id="lpt">PT</button></span></header>
<h1 id="t"></h1><p id="intro"></p><small id="mode"></small>
<h3 data-i="interrogate"></h3><div class="s" id="sus"></div><div id="log" aria-live="polite"></div>
<form id="f"><input id="q" maxlength="500"><button data-i="ask"></button></form><small id="qc"></small>
<h3 data-i="accuse"></h3><input id="player" maxlength="24"><div class="s" id="acc" style="margin-top:.5rem"></div><p id="verdict"></p>
<h3 data-i="board"></h3><ol id="board"></ol>
<script>
const T={en:{interrogate:'Interrogate',ask:'Ask',accuse:'Accuse',board:'Scoreboard',ph:'Ask a question...',name:'Your detective name',you:'You',choose:'Choose a suspect.',mock:'Offline mode (no FullCup key)',live:'Live on FullCup: ',acc:'Accuse ',ok:'Case solved! ',bad:'Wrong. ',score:'Score: ',qs:'Questions asked: ',none:'No scores yet.'},
pt:{interrogate:'Interrogar',ask:'Perguntar',accuse:'Acusar',board:'Placar',ph:'Faça uma pergunta...',name:'Seu nome de detetive',you:'Você',choose:'Escolha um suspeito.',mock:'Modo offline (sem chave FullCup)',live:'Ao vivo na FullCup: ',acc:'Acusar ',ok:'Caso resolvido! ',bad:'Errado. ',score:'Pontos: ',qs:'Perguntas feitas: ',none:'Nenhum placar ainda.'}};
let lang=localStorage.lang||(navigator.language.startsWith('pt')?'pt':'en'),C,cur,H={},sid,n=0,done=false;const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const post=(p,b)=>fetch(p+'?lang='+lang,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
function render(){$('log').innerHTML=(H[cur]||[]).map(m=>`<p class="${m.err?'err':''}"><b>${m.role==='user'?T[lang].you:esc(C.suspects.find(s=>s.id===cur).name)}:</b> ${esc(m.content)}</p>`).join('')||'<i>'+T[lang].choose+'</i>';$('qc').textContent=T[lang].qs+n}
async function board(){const r=await (await fetch('/api/scoreboard')).json();$('board').innerHTML=r.scores.map(s=>`<li>${esc(s.player)}: ${s.score} (${s.questions}q)</li>`).join('')||'<i>'+T[lang].none+'</i>'}
async function load(){localStorage.lang=lang;document.documentElement.lang=lang==='pt'?'pt-BR':'en';
document.querySelectorAll('[data-i]').forEach(e=>e.textContent=T[lang][e.dataset.i]);$('q').placeholder=T[lang].ph;$('player').placeholder=T[lang].name;
C=await (await fetch('/api/case?lang='+lang)).json();const st=await (await fetch('/api/status')).json();
$('t').textContent=C.title;$('intro').textContent=C.intro;$('mode').textContent=st.mode==='mock'?T[lang].mock:T[lang].live+(st.model||'');
$('sus').innerHTML='';$('acc').innerHTML='';
for(const s of C.suspects){const b=document.createElement('button');b.innerHTML=`<b>${esc(s.name)}</b><br>${esc(s.role)}`;if(s.id===cur)b.classList.add('on');b.onclick=()=>{cur=s.id;document.querySelectorAll('#sus button').forEach(x=>x.classList.remove('on'));b.classList.add('on');render()};$('sus').append(b);
const a=document.createElement('button');a.textContent=T[lang].acc+s.name;a.disabled=done;a.onclick=async()=>{const r=await (await post('/api/accuse',{suspectId:s.id,sessionId:sid,player:$('player').value})).json();
if(r.error){$('verdict').textContent=r.error;return}done=true;$('verdict').textContent=(r.correct?T[lang].ok:T[lang].bad)+r.solution+' '+T[lang].score+r.score;document.querySelectorAll('#acc button').forEach(x=>x.disabled=true);board()};$('acc').append(a)}render();board()}
$('len').onclick=()=>{lang='en';load()};$('lpt').onclick=()=>{lang='pt';load()};
$('f').onsubmit=async e=>{e.preventDefault();const q=$('q').value.trim();if(!q||!cur)return;$('q').value='';H[cur]=H[cur]||[];
const history=H[cur].filter(m=>!m.err);H[cur].push({role:'user',content:q});render();
let r;try{r=await (await post('/api/ask',{suspectId:cur,question:q,history,sessionId:sid})).json()}catch{r={error:T[lang].bad}}
if(!r.error)n++;H[cur].push(r.error?{role:'assistant',content:r.error,err:1}:{role:'assistant',content:r.answer});render()};
(async()=>{sid=(await (await post('/api/session',{})).json()).sessionId;load()})();
</script></body></html>
