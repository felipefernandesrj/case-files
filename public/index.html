<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Case Files: AI Detective</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; }
    #lang-toggle { margin-bottom: 1rem; }
    .suspect { border: 1px solid #ccc; padding: 1rem; margin: 0.5rem 0; }
    .chat { margin-top: 0.5rem; }
    .answer { font-weight: bold; margin-top: 0.3rem; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <button id="lang-toggle">EN/PT</button>
  <h1 id="title">Loading...</h1>
  <p id="intro"></p>
  <div id="suspects"></div>
  <div id="verdict" class="hidden">
    <h2 id="verdict-title"></h2>
    <p id="solution"></p>
  </div>

  <script>
    const langBtn = document.getElementById('lang-toggle');
    let lang = 'en';

    async function loadCase() {
      const res = await fetch(`/api/case?lang=${lang}`);
      const data = await res.json();
      document.getElementById('title').textContent = data.title;
      document.getElementById('intro').textContent = data.intro;
      const container = document.getElementById('suspects');
      container.innerHTML = '';
      data.suspects.forEach(s => {
        const div = document.createElement('div');
        div.className = 'suspect';
        div.dataset.id = s.id;
        div.innerHTML = `
          <strong>${s.name}</strong> - ${s.role}<br>
          <em>${s.persona}</em><br>
          <input type="text" placeholder="${lang==='en'?'Ask...':'Pergunte...'}" class="question">
          <button class="ask">${lang==='en'?'Ask':'Perguntar'}</button>
          <div class="chat"><span class="answer"></span></div>
          <button class="accuse">${lang==='en'?'Accuse':'Acusar'}</button>
        `;
        container.appendChild(div);
      });
    }

    async function ask(suspectDiv) {
      const suspectId = suspectDiv.dataset.id;
      const qInput = suspectDiv.querySelector('.question');
      const question = qInput.value.trim();
      if (!question) return;
      const resp = await fetch('/api/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ suspectId, question, lang, history: [] })
      });
      const data = await resp.json();
      suspectDiv.querySelector('.answer').textContent = data.answer || '';
    }

    async function accuse(suspectDiv) {
      const suspectId = suspectDiv.dataset.id;
      const resp = await fetch('/api/accuse', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ suspectId, lang })
      });
      const data = await resp.json();
      document.getElementById('verdict-title').textContent = data.correct
        ? (lang==='en'?'Correct!':'Correto!')
        : (lang==='en'?'Wrong!':'Errado!');
      document.getElementById('solution').textContent = data.solution;
      document.getElementById('verdict').classList.remove('hidden');
    }

    document.addEventListener('click', e => {
      if (e.target.matches('.ask')) {
        ask(e.target.closest('.suspect'));
      } else if (e.target.matches('.accuse')) {
        accuse(e.target.closest('.suspect'));
      }
    });

    langBtn.addEventListener('click', () => {
      lang = lang === 'en' ? 'pt' : 'en';
      loadCase();
    });

    loadCase();
  </script>
</body>
</html>
