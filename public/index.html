<!DOCTYPE html>
<html lang="en" data-accent="salon">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Case Files</title>
<link rel="stylesheet" href="/css/game.css">
</head>
<body>
<header>
  <h1 id="title">Case Files</h1>
  <div class="hud-tools">
    <button id="len" aria-pressed="true">EN</button>
    <button id="lpt" aria-pressed="false">PT</button>
    <button id="restart-btn" type="button">Start over</button>
  </div>
</header>

<section id="cabinet" hidden>
  <p class="stamp" id="cabinet-stamp">Field office</p>
  <h2 id="cabinet-title">Case Files</h2>
  <p id="cabinet-lead">Two closed rooms. Open a file, ask the questions, name who did it.</p>
  <div id="cabinet-list"></div>
</section>

<main id="play">
  <section id="briefing" aria-labelledby="title">
    <p class="stamp" id="brief-stamp">Case file</p>
    <section id="intro"></section>
  </section>


  <section id="suspects">
    <h2 id="suspects-title">Suspects</h2>
    <div id="suspect-buttons"></div>
  </section>

  <section id="conversation">
    <h2 id="conversation-title">Conversation</h2>
    <div id="log" role="log" aria-live="polite"></div>
    <form id="ask-form">
      <label for="q" id="question-label">Question</label>
      <div class="ask-row">
        <input type="text" id="q" maxlength="500" required>
        <button type="submit" id="ask-btn">Ask</button>
      </div>
    </form>
    <p id="questions-used" aria-live="polite"></p>
  </section>

  <section id="player-section">
    <label for="player" id="player-label">Your name</label>
    <input type="text" id="player" maxlength="24" placeholder="anon">
  </section>

  <section id="accuse-section">
    <h2 id="accuse-title">Accuse</h2>
    <div id="accuse-buttons"></div>
  </section>


  <section id="rooms" aria-labelledby="rooms-title">
    <h2 id="rooms-title" class="visually-in-section">Locations</h2>
    <div id="room-buttons"></div>
  </section>
  <style>
    #rooms { display: grid; }
    #room-buttons { display: contents; }
    #rooms-title { margin: 0 0 0.5rem; grid-column: 1 / -1; }
  </style>

  <section id="timeline" hidden aria-labelledby="timeline-title">
    <h2 id="timeline-title">Timetable</h2>
    <div id="timeline-rail"></div>
  </section>

  <section id="board" hidden aria-labelledby="board-title">
    <h2 id="board-title">Evidence board</h2>
    <div id="board-grid"></div>
  </section>

  <section id="verdict" role="status" aria-live="assertive" tabindex="-1" hidden></section>
  <section id="err" role="alert" hidden></section>

  <section id="best-section" aria-labelledby="best-title">
    <h2 id="best-title"></h2>
    <p id="best-en"></p>
    <p id="best-pt"></p>
    <button id="reset-best" type="button">Reset Best</button>
    <p id="best-status" role="status"></p>
  </section>
  <section id="scores-section" hidden>
    <h2 id="scores-title">Scoreboard</h2>
    <table>
      <caption id="scores-caption">Top 10 Players</caption>
      <thead>
        <tr>
          <th>#</th>
          <th id="th-player">Player</th>
          <th id="th-score">Score</th>
          <th id="th-questions">Questions</th>
        </tr>
      </thead>
      <tbody id="scores-body"></tbody>
    </table>
  </section>

  <section id="credits" aria-labelledby="credits-title" tabindex="-1" hidden>
    <h2 id="credits-title"></h2>
    <ul id="credits-list"></ul>
    <p id="credits-note"></p>
  </section>
</main>

<nav id="dock" aria-label="Case tools">
  <button type="button" id="files-btn" class="icon-btn">Files</button>
  <button type="button" id="board-btn" class="icon-btn">Board</button>
</nav>

<script type="module">
const API = '/api';
import { readBest, recordResult, resetBest, bestText, questionsText, LABELS } from '/best.js';
const store = (() => { try { return window.localStorage; } catch { return null; } })();
let lang = 'en';
let sessionId = null;
let caseData = null;
let selectedSuspect = null;
let lastAccuseResult = null;
let gameOver = false;
let openFile = '';
let packList = [];
let pins = [];
let currentRoom = null;
const UI = {
  en: {
    pack: 'Case Files', files: 'Files', board: 'Board', boardTitle: 'Evidence board',
    rooms: 'Locations', timeline: 'Timetable', inspect: 'Inspect', pin: 'Pin',
    emptyBoard: 'No pins yet. Inspect a room or pin a line from a conversation.',
    cabinetLead: 'Two closed rooms. Open a file, ask the questions, name who did it.',
    cabinetStamp: 'Field office', openFile: 'Open file', briefStamp: 'Case file',
    unpin: 'Remove pin'
  },
  pt: {
    pack: 'Dossiês', files: 'Arquivos', board: 'Quadro', boardTitle: 'Quadro de evidências',
    rooms: 'Locais', timeline: 'Horário', inspect: 'Examinar', pin: 'Fixar',
    emptyBoard: 'Nenhum item ainda. Examine um local ou fixe uma fala da conversa.',
    cabinetLead: 'Dois cômodos fechados. Abra um dossiê, faça as perguntas, diga quem foi.',
    cabinetStamp: 'Escritório de campo', openFile: 'Abrir dossiê', briefStamp: 'Dossiê',
    unpin: 'Retirar'
  }
};
function setGameOver(on){
  gameOver = !!on;
  const q = document.getElementById('q');
  const ask = document.getElementById('ask-btn');
  const accuseBtns = document.querySelectorAll('#accuse-buttons button');
  if (on) {
    q.disabled = true;
    ask.disabled = true;
    accuseBtns.forEach(b => { b.disabled = true; });
    document.getElementById('best-status').textContent = LABELS[lang].gameOver;
  } else {
    q.disabled = false;
    ask.disabled = false;
    accuseBtns.forEach(b => { b.disabled = false; });
  }
}
const histories = {}; // per suspectId [{q,a},...]

async function setLang(newLang) {
  lang = newLang;
  document.documentElement.lang = newLang === 'pt' ? 'pt-BR' : 'en';
  document.getElementById('len').setAttribute('aria-pressed', newLang === 'en');
  document.getElementById('lpt').setAttribute('aria-pressed', newLang === 'pt');
  
  // Basic UI
  document.getElementById('question-label').textContent = newLang === 'pt' ? 'Pergunta' : 'Question';
  document.getElementById('ask-btn').textContent = newLang === 'pt' ? 'Perguntar' : 'Ask';
  document.getElementById('player-label').textContent = newLang === 'pt' ? 'Seu nome' : 'Your name';
  document.getElementById('suspects-title').textContent = newLang === 'pt' ? 'Suspeitos' : 'Suspects';
  document.getElementById('conversation-title').textContent = newLang === 'pt' ? 'Conversa' : 'Conversation';
  document.getElementById('accuse-title').textContent = newLang === 'pt' ? 'Acusar' : 'Accuse';
  document.getElementById('title').textContent = (caseData && caseData.title) ? caseData.title : UI[newLang].pack;
  document.getElementById('restart-btn').textContent = LABELS[newLang].startOver;
  document.getElementById('files-btn').textContent = UI[newLang].files;
  document.getElementById('board-btn').textContent = UI[newLang].board;
  document.getElementById('board-title').textContent = UI[newLang].boardTitle;
  document.getElementById('rooms-title').textContent = UI[newLang].rooms;
  document.getElementById('timeline-title').textContent = UI[newLang].timeline;
  document.getElementById('cabinet-title').textContent = UI[newLang].pack;
  document.getElementById('cabinet-lead').textContent = UI[newLang].cabinetLead;
  document.getElementById('cabinet-stamp').textContent = UI[newLang].cabinetStamp;
  document.getElementById('brief-stamp').textContent = UI[newLang].briefStamp;

  // Scoreboard
  document.getElementById('scores-title').textContent = newLang === 'pt' ? 'Placar' : 'Scoreboard';
  document.getElementById('scores-caption').textContent = newLang === 'pt' ? '10 melhores jogadores' : 'Top 10 Players';
  document.getElementById('th-player').textContent = newLang === 'pt' ? 'Jogador' : 'Player';
  document.getElementById('th-score').textContent = newLang === 'pt' ? 'Pontos' : 'Score';
  document.getElementById('th-questions').textContent = newLang === 'pt' ? 'Perguntas' : 'Questions';

  renderBest();
  renderQuestions();
  document.getElementById('best-status').textContent = gameOver ? LABELS[lang].gameOver : '';

  await loadPackList();
  await loadCase();
  renderCase();
  renderAccuseButtons();
  renderConversation();
  renderCabinet();
  if (lastAccuseResult) renderVerdict(false);
  if (!document.getElementById('credits').hidden) await loadCredits(false);
}

document.getElementById('len').addEventListener('click',()=>setLang('en'));
document.getElementById('lpt').addEventListener('click',()=>setLang('pt'));

async function init() {
  const sessRes = await fetch(API + '/session', {method:'POST'});
  const sessData = await sessRes.json();
  sessionId = sessData.sessionId;
  if (sessData.file) openFile = sessData.file;
  const wanted = new URLSearchParams(location.search).get('case');
  if (wanted) openFile = wanted;
  await loadPackList();
  await loadCase();
  await setLang('en');
}

async function loadPackList() {
  try {
    const res = await fetch(API + '/cases?lang=' + lang);
    const data = await res.json();
    packList = data.cases || [];
  } catch {
    packList = [];
  }
}

async function loadCase() {
  const extra = openFile ? '&case=' + encodeURIComponent(openFile) : '';
  const res = await fetch(API + '/case?lang=' + lang + extra);
  caseData = await res.json();
  if (caseData && caseData.file) openFile = caseData.file;
}

function initials(name) {
  return (name || '?').split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase();
}

function renderCase() {
  if (!caseData) return;
  document.getElementById('intro').innerHTML = `<p>${caseData.intro}</p>`;
  document.getElementById('title').textContent = caseData.title || UI[lang].pack;
  document.documentElement.setAttribute('data-accent', caseData.file === 'violin' ? 'salon' : 'rails');
  const btnContainer = document.getElementById('suspect-buttons');
  btnContainer.innerHTML = '';
  caseData.suspects.forEach(s => {
    const btn = document.createElement('button');
    const face = document.createElement('span');
    face.className = 'portrait';
    face.setAttribute('aria-hidden', 'true');
    face.textContent = initials(s.name);
    const who = document.createElement('span');
    who.className = 'who';
    who.textContent = s.name;
    const role = document.createElement('span');
    role.className = 'role';
    role.textContent = s.role || '';
    btn.appendChild(face);
    btn.appendChild(who);
    if (s.role) btn.appendChild(role);
    btn.dataset.id = s.id;
    btn.setAttribute('aria-pressed','false');
    btn.addEventListener('click',()=>selectSuspect(s.id));
    btnContainer.appendChild(btn);
  });
  renderRooms();
  renderTimeline();
  renderBoard();
}

function renderRooms() {
  const wrap = document.getElementById('room-buttons');
  wrap.innerHTML = '';
  const rooms = (caseData && caseData.rooms) || [];
  rooms.forEach(r => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'room';
    btn.dataset.room = r.id;
    btn.dataset.id = r.id;
    btn.setAttribute('aria-pressed', currentRoom === r.id ? 'true' : 'false');
    const name = document.createElement('span');
    name.className = 'room-name';
    name.textContent = r.name;
    btn.appendChild(name);
    btn.addEventListener('click', () => inspectRoom(r));
    wrap.appendChild(btn);
  });
}

function inspectRoom(r) {
  currentRoom = r.id;
  renderRooms();
  const label = r.name;
  if (!pins.some(p => p.id === r.id)) {
    pins.push({ id: r.id, label });
    renderBoard();
  }
}

function renderTimeline() {
  const sec = document.getElementById('timeline');
  const rail = document.getElementById('timeline-rail');
  const items = (caseData && caseData.timeline) || [];
  if (!items.length) { sec.hidden = true; rail.innerHTML = ''; return; }
  sec.hidden = false;
  rail.innerHTML = '';
  items.forEach(t => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'tl-stop';
    if (t.id) b.dataset.id = t.id;
    const tm = document.createElement('strong');
    tm.textContent = t.time || '';
    b.appendChild(tm);
    b.appendChild(document.createTextNode((t.stop ? t.stop + '. ' : '') + (t.event || '')));
    rail.appendChild(b);
  });
}

function renderBoard() {
  const grid = document.getElementById('board-grid');
  grid.innerHTML = '';
  if (!pins.length) {
    const empty = document.createElement('p');
    empty.className = 'ev-empty';
    empty.textContent = UI[lang].emptyBoard;
    grid.appendChild(empty);
    return;
  }
  pins.forEach((p, i) => {
    const tile = document.createElement('button');
    tile.type = 'button';
    tile.className = 'ev-tile';
    tile.textContent = p.label;
    tile.setAttribute('aria-label', UI[lang].unpin + ': ' + p.label);
    tile.addEventListener('click', () => { pins.splice(i, 1); renderBoard(); });
    grid.appendChild(tile);
  });
}

function renderCabinet() {
  const list = document.getElementById('cabinet-list');
  list.innerHTML = '';
  packList.forEach((item, i) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'folder-card';
    btn.dataset.file = item.id;
    const art = document.createElement('div');
    art.className = 'folder-art';
    art.setAttribute('aria-hidden', 'true');
    const title = document.createElement('strong');
    title.textContent = item.title;
    const hook = document.createElement('span');
    hook.textContent = item.hook;
    const go = document.createElement('span');
    go.textContent = UI[lang].openFile;
    btn.appendChild(art);
    btn.appendChild(title);
    btn.appendChild(hook);
    btn.appendChild(go);
    btn.addEventListener('click', () => openPackFile(item.id));
    list.appendChild(btn);
  });
}

function showCabinet() {
  document.getElementById('cabinet').hidden = false;
  document.getElementById('play').hidden = true;
  const first = document.querySelector('#cabinet-list button');
  if (first) first.focus();
}

function showPlay() {
  document.getElementById('cabinet').hidden = true;
  document.getElementById('play').hidden = false;
}

async function openPackFile(id) {
  const sessRes = await fetch(API + '/session', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ case: id })});
  const sessData = await sessRes.json();
  sessionId = sessData.sessionId;
  openFile = id;
  for (const k of Object.keys(histories)) delete histories[k];
  pins = [];
  currentRoom = null;
  questionsUsed = 0;
  selectedSuspect = null;
  lastAccuseResult = null;
  gameOver = false;
  setGameOver(false);
  document.getElementById('log').innerHTML = '';
  const verdict = document.getElementById('verdict');
  verdict.hidden = true;
  verdict.innerHTML = '';
  document.getElementById('credits').hidden = true;
  document.getElementById('scores-section').hidden = true;
  document.getElementById('err').hidden = true;
  document.getElementById('board').hidden = true;
  document.getElementById('best-status').textContent = '';
  await loadCase();
  renderQuestions();
  renderBest();
  renderCase();
  renderAccuseButtons();
  renderConversation();
  showPlay();
  const first = document.querySelector('#suspect-buttons button');
  if (first) first.focus();
}

document.getElementById('files-btn').addEventListener('click', async () => {
  await loadPackList();
  renderCabinet();
  showCabinet();
});
document.getElementById('board-btn').addEventListener('click', () => {
  const board = document.getElementById('board');
  board.hidden = !board.hidden;
  if (!board.hidden) {
    renderBoard();
    document.getElementById('board-title').focus?.();
    board.scrollIntoView({ block: 'nearest' });
  }
});

function selectSuspect(id) {
  selectedSuspect = id;
  const bs = document.getElementById('best-status');
  if (bs.textContent === LABELS.en.pickSuspect || bs.textContent === LABELS.pt.pickSuspect) bs.textContent = '';
  document.querySelectorAll('#suspect-buttons button').forEach(b=>{
    b.setAttribute('aria-pressed', b.dataset.id===id ? 'true':'false');
  });
  document.getElementById('q').focus();
  renderConversation();
}

function renderConversation() {
  const log = document.getElementById('log');
  log.innerHTML = '';
  if (!selectedSuspect) return;
  const hist = histories[selectedSuspect] || [];
  hist.forEach(pair=>{
    const pQ = document.createElement('p');
    pQ.textContent = (lang==='pt'?'Pergunta: ':'Q: ') + pair.q;
    const pA = document.createElement('p');
    pA.textContent = (lang==='pt'?'Resposta: ':'A: ') + pair.a;
    log.appendChild(pQ);
    log.appendChild(pA);
  });
}

async function askQuestion(e){
  e.preventDefault();
  if (gameOver) return;
  if (!selectedSuspect) { document.getElementById('best-status').textContent = LABELS[lang].pickSuspect; return; }
  const question = document.getElementById('q').value.trim();
  if (!question) { document.getElementById('best-status').textContent = LABELS[lang].emptyQuestion; document.getElementById('q').focus(); return; }
  const qInput = document.getElementById('q');
  const askBtn = document.getElementById('ask-btn');
  const askForm = document.getElementById('ask-form');
  const accuseBtns = document.querySelectorAll('#accuse-buttons button');
  const restartBtn = document.getElementById('restart-btn');
  askBtn.disabled = true;
  qInput.disabled = true;
  accuseBtns.forEach(b => { b.disabled = true; });
  if (restartBtn) restartBtn.disabled = true;
  askForm.setAttribute('aria-busy', 'true');
  const log = document.getElementById('log');
  const thinking = document.createElement('p');
  thinking.textContent = LABELS[lang].thinking;
  log.appendChild(thinking);
  try{
    const res = await fetch(API + '/ask', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({sessionId, suspectId:selectedSuspect, question, lang})
    });
    const data = await res.json();
    if (!res.ok) throw data;
    const answer = data.answer;
    questionsUsed = data.questions;
    renderQuestions();
    if (!histories[selectedSuspect]) histories[selectedSuspect]=[];
    histories[selectedSuspect].push({q:question,a:answer});
    renderConversation();
  }catch(err){
    showError(err.message||'Error');
  }finally{
    if (thinking.parentNode) thinking.remove();
    askBtn.disabled = false;
    qInput.disabled = false;
    accuseBtns.forEach(b => { b.disabled = false; });
    if (restartBtn) restartBtn.disabled = false;
    askForm.removeAttribute('aria-busy');
    qInput.value = '';
    qInput.focus();
  }
}

async function accuse(suspectId){
  const playerName = document.getElementById('player').value.trim()||'anon';
  try{
    const res = await fetch(API + '/accuse', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({sessionId, suspectId, player:playerName, lang})
    });
    const data = await res.json();
    if (!res.ok) throw data;
    lastAccuseResult = data;
    const rec = recordResult(store, lang, data);
    renderBest();
    document.getElementById('best-status').textContent = rec.isNew ? LABELS[lang].newBest : '';
    renderVerdict(true);
    setGameOver(true);
    await loadScores();
    await loadCredits(true);
  }catch(err){
    showError(err.message||'Error');
  }
}

function renderAccuseButtons(){
  if (!caseData) return;
  const container = document.getElementById('accuse-buttons');
  container.innerHTML = '';
  caseData.suspects.forEach(s=>{
    const btn = document.createElement('button');
    btn.textContent = (lang==='pt'?'Acusar ':'Accuse ') + s.name;
    btn.addEventListener('click',()=>{
      if (gameOver) return;
      if (confirm(LABELS[lang].confirmAccuse.replace('{name}', s.name))) {
        accuse(s.id);
      }
    });
    container.appendChild(btn);
  });
  if (gameOver) {
    container.querySelectorAll('button').forEach(b => { b.disabled = true; });
  }
}

async function loadScores(){
  const sec = document.getElementById('scores-section');
  const tbody = document.getElementById('scores-body');
  const extra = (typeof openFile === 'string' && openFile) ? ('?case=' + encodeURIComponent(openFile)) : '';
  const res = await fetch(API + '/scores' + extra);
  const data = await res.json();
  tbody.innerHTML = '';
  data.forEach((row,i)=>{
    const tr = document.createElement('tr');
    [i + 1, row.player, row.score, row.questions].forEach(value => {
      const td = document.createElement('td');
      td.textContent = String(value);
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  sec.hidden = false;
}

async function loadCredits(moveFocus = true) {
  try {
    const res = await fetch(API + '/credits?lang=' + lang);
    const data = await res.json();
    const section = document.getElementById('credits');
    const title = document.getElementById('credits-title');
    const list = document.getElementById('credits-list');
    const note = document.getElementById('credits-note');

    title.textContent = data.title;
    list.innerHTML = '';
    data.backers.forEach(name => {
      const li = document.createElement('li');
      li.textContent = name;
      list.appendChild(li);
    });

    if (data.example) {
      note.textContent = lang === 'pt' ? 'Nomes de exemplo' : 'Example names';
      note.hidden = false;
    } else {
      note.hidden = true;
    }

    section.hidden = false;
    if (moveFocus) section.focus();
  } catch (e) {
    console.error('Credits error:', e);
  }
}

function renderVerdict(moveFocus = true) {
  if (!lastAccuseResult) return;
  const verdict = document.getElementById('verdict');
  verdict.hidden = false;
  const { correct, culpritName, solution, score } = lastAccuseResult;
  verdict.classList.toggle('ok', !!correct);
  verdict.innerHTML = `
    <p>${correct ? (lang==='pt'?'Você acertou!':'Correct!') : (lang==='pt'?'Você errou!':'Wrong!')}</p>
    <p>${lang==='pt'?'Culpado':'Culprit'}: ${culpritName}</p>
    <p>${lang==='pt'?'Solução':'Solution'}: ${solution}</p>
    <p>${lang==='pt'?'Pontuação':'Score'}: ${score}</p>`;
  if (moveFocus) verdict.focus();
}

function showError(msg){
  const el = document.getElementById('err');
  el.textContent = msg || (lang === 'pt' ? 'Erro' : 'Error');
  el.hidden = false;
  setTimeout(()=>{el.hidden=true;},5000);
}

let questionsUsed = 0;
function renderQuestions() {
  document.getElementById('questions-used').textContent = questionsText(lang, questionsUsed);
}

function renderBest() {
  const b = readBest(store);
  document.getElementById('best-title').textContent = LABELS[lang].bestTitle;
  document.getElementById('reset-best').textContent = LABELS[lang].reset;
  document.getElementById('best-en').textContent = bestText('en', b.en, lang);
  document.getElementById('best-pt').textContent = bestText('pt', b.pt, lang);
}

document.getElementById('reset-best').addEventListener('click', () => {
  const btn = document.getElementById('reset-best');
  let status = '';
  if (confirm(LABELS[lang].confirm)) {
    resetBest(store);
    status = LABELS[lang].done;
  } else {
    status = LABELS[lang].kept;
  }
  renderBest();
  document.getElementById('best-status').textContent = status;
  btn.focus();
});

async function restartGame(){
  if (!confirm(LABELS[lang].confirmRestart)) return;
  const sessRes = await fetch(API + '/session', {method:'POST'});
  const sessData = await sessRes.json();
  sessionId = sessData.sessionId;
  for (const k of Object.keys(histories)) delete histories[k];
  questionsUsed = 0;
  selectedSuspect = null;
  lastAccuseResult = null;
  gameOver = false;
  setGameOver(false);
  document.getElementById('log').innerHTML = '';
  const verdict = document.getElementById('verdict');
  verdict.hidden = true;
  verdict.innerHTML = '';
  document.getElementById('credits').hidden = true;
  document.getElementById('scores-section').hidden = true;
  document.getElementById('err').hidden = true;
  document.getElementById('ask-btn').disabled = false;
  document.getElementById('q').disabled = false;
  document.getElementById('q').value = '';
  document.getElementById('ask-form').removeAttribute('aria-busy');
  document.querySelectorAll('#accuse-buttons button').forEach(b => { b.disabled = false; });
  document.getElementById('restart-btn').disabled = false;
  document.getElementById('best-status').textContent = '';
  pins = [];
  currentRoom = null;
  renderQuestions();
  renderBest();
  renderCase();
  renderAccuseButtons();
  renderConversation();
  const first = document.querySelector('#suspect-buttons button');
  if (first) first.focus();
  else document.getElementById('q').focus();
}
document.getElementById('restart-btn').addEventListener('click', restartGame);
document.getElementById('ask-form').addEventListener('submit',askQuestion);
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  const q = document.getElementById('q');
  if (document.activeElement !== q && e.target !== q) return;
  q.value = '';
  q.focus();
});
init();
</script>
</body>
</html>
