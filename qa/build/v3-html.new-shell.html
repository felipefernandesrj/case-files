<div class="shell">
  <header>
    <h1 id="title" class="with-icon"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-score"></use></svg> <span data-label="">Case Files</span></h1>
    <p id="best-hud" class="best-hud" aria-live="polite"></p>
    <div class="hud-tools">
      <button id="len" aria-pressed="true" class="with-icon"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-lang"></use></svg> <span data-label="">EN</span></button>
      <button id="lpt" aria-pressed="false" class="with-icon"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-lang"></use></svg> <span data-label="">PT</span></button>
      <button id="restart-btn" type="button" class="with-icon"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-restart"></use></svg> <span data-label="">Start over</span></button>
      <button id="files-btn" class="with-icon" aria-label="Files"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-files"></use></svg> <span data-label="">Files</span></button>
    </div>
  </header>

  <section id="cabinet" hidden>
    <p class="stamp" id="cabinet-stamp">Field office</p>
    <h2 id="cabinet-title" class="with-icon"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-files"></use></svg> <span data-label="">Case Files</span></h2>
    <p id="cabinet-lead">Two closed rooms. Open a file, ask the questions, name who did it.</p>
    <div id="cabinet-list"></div>
  </section>

  <div id="desk">
    <section id="case-summary">
      <p class="stamp" id="summary-stamp">Case file</p>
      <div id="summary-intro"></div>
    </section>

    <section id="suspects" class="panel" data-panel="suspects">
      <h2 id="suspects-title" class="with-icon"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-suspects"></use></svg> <span data-label="Suspects">Suspects</span></h2>
      <div id="suspect-buttons"></div>
    </section>

    <nav id="steps" role="tablist" aria-label="Case steps">
      <button type="button" role="tab" id="step-briefing" data-step="briefing" aria-selected="true" class="with-icon"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-briefing"></use></svg> <span data-step-label="Brief">Brief</span></button>
      <button type="button" role="tab" id="step-locations" data-step="locations" aria-selected="false" class="with-icon"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-locations"></use></svg> <span data-step-label="Places">Places</span></button>
      <button type="button" role="tab" id="step-suspects" data-step="suspects" aria-selected="false" class="with-icon"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-suspects"></use></svg> <span data-step-label="People">People</span></button>
      <button type="button" role="tab" id="step-talk" data-step="talk" aria-selected="false" class="with-icon"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-talk"></use></svg> <span data-step-label="Ask">Ask</span></button>
      <button type="button" role="tab" id="step-board" data-step="board" aria-selected="false" class="with-icon"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-board"></use></svg> <span data-step-label="Board">Board</span></button>
      <button type="button" role="tab" id="step-accuse" data-step="accuse" aria-selected="false" class="with-icon"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-accuse"></use></svg> <span data-step-label="Accuse">Accuse</span></button>
    </nav>

    <main id="play">
      <section id="briefing" class="panel is-on" data-panel="briefing">
        <p class="stamp" id="brief-stamp">Case file</p>
        <div id="intro"></div>
      </section>

      <section id="dossier" class="panel" data-panel="suspects" aria-labelledby="dossier-heading">
        <h2 id="dossier-heading" class="with-icon"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-suspects"></use></svg> <span data-label="Suspects">Suspects</span></h2>
        <div id="dossier-body"></div>
      </section>

      <section id="conversation" class="panel" data-panel="talk">
        <h2 id="conversation-title" class="with-icon"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-talk"></use></svg> <span data-label="Conversation">Conversation</span></h2>
        <div id="log" role="log" aria-live="polite"></div>
        <form id="ask-form">
          <label for="q" id="question-label">Question</label>
          <div class="ask-row">
            <input type="text" id="q" maxlength="500" required>
            <button type="submit" id="ask-btn" class="with-icon"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-talk"></use></svg> <span data-label="Ask">Ask</span></button>
          </div>
        </form>
        <p id="questions-used" aria-live="polite"></p>
      </section>

      <section id="locations" class="panel" data-panel="locations" data-loc="rooms" aria-labelledby="rooms-title">
        <div id="loc-switch" hidden>
          <button id="loc-time" data-loc-view="time" class="with-icon"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-tl-marker"></use></svg> <span data-label="Time">Time</span></button>
          <button id="loc-rooms" data-loc-view="rooms" class="with-icon"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-locations"></use></svg> <span data-label="Rooms">Rooms</span></button>
        </div>
        <section id="timeline" hidden aria-labelledby="timeline-title">
          <h2 id="timeline-title" class="with-icon"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-tl-marker"></use></svg> <span data-label="Timetable">Timetable</span></h2>
          <div id="timeline-rail"></div>
        </section>
        <section id="rooms" aria-labelledby="rooms-title">
          <h2 id="rooms-title" class="with-icon"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-locations"></use></svg> <span data-label="Locations">Locations</span></h2>
          <div id="room-buttons"></div>
        </section>
      </section>

      <section id="board" class="panel" data-panel="board" aria-labelledby="board-title">
        <h2 id="board-title" class="with-icon"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-board"></use></svg> <span data-label="Evidence board">Evidence board</span></h2>
        <div id="board-grid"></div>
      </section>

      <section id="accuse-stage" class="panel" data-panel="accuse">
        <div id="player-section">
          <label for="player" id="player-label">Your name</label>
          <input type="text" id="player" maxlength="24" placeholder="anon">
        </div>
        <div id="accuse-section">
          <h2 id="accuse-title" class="with-icon"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-accuse"></use></svg> <span data-label="Accuse">Accuse</span></h2>
          <div id="accuse-buttons"></div>
        </div>
        <div id="verdict" role="status" aria-live="assertive" tabindex="-1" hidden></div>
        <div id="err" role="alert" hidden></div>
        <section id="best-section" aria-labelledby="best-title">
          <h2 id="best-title" class="with-icon"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-score"></use></svg> <span data-label="Best"></span></h2>
          <p id="best-en"></p>
          <p id="best-pt"></p>
          <button id="reset-best" type="button">Reset Best</button>
          <p id="best-status" role="status"></p>
        </section>
        <section id="scores-section" hidden>
          <h2 id="scores-title" class="with-icon"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-score"></use></svg> <span data-label="Scoreboard">Scoreboard</span></h2>
          <table>
            <caption id="scores-caption">Top 10 Players</caption>
            <thead>
              <tr>
                <th id="th-player">Player</th>
                <th id="th-score">Score</th>
                <th id="th-questions">Questions</th>
              </tr>
            </thead>
            <tbody id="scores-body"></tbody>
          </table>
        </section>
        <section id="credits" aria-labelledby="credits-title" tabindex="-1" hidden>
          <h2 id="credits-title" class="with-icon"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-score"></use></svg> <span data-label="Credits">Credits</span></h2>
          <ul id="credits-list"></ul>
          <p id="credits-note"></p>
        </section>
      </section>
    </main>

    <aside id="rail-right" hidden>
      <h2 id="pin-rail-title" class="with-icon"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-pin"></use></svg> <span data-label="Pinned">Pinned</span></h2>
      <div id="pin-rail"></div>
    </aside>
  </div>
</div>
